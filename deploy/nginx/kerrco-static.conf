# Include inside the kerrco.us HTTPS server block.
# Point current at an extracted, validated release directory.
root /var/www/kerrco/current;
index index.html;
autoindex off;

error_page 404 /404.html;

location = /404.html {
    internal;
}

# Keep mutable filenames fresh after a release or rollback.
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

# Photo filenames are not content-hashed, so avoid immutable/year-long caching.
location /assets/ {
    try_files $uri =404;
    expires 1h;
}

# The packaged site has no server-side forms or private files.
location ~ \.php(?:/|$) {
    return 404;
}

location ~ /\. {
    return 404;
}
